<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Request a print | HL Art Gallery</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="buy-print.css"><script defer src="print-request.js"></script></head>
<body><main class="purchase-wrap"><a href="art-collections.html">← Back to Collections</a><section class="print-receipt"><p class="receipt-kicker">HL Art Gallery</p><h1>Request a print</h1><p>The gallery will review availability and delivery. No payment is taken now.</p>
<form id="printRequest" class="address-fields">
<label class="wide">Artwork and edition<select name="editionId" required><option value="">Choose an edition</option><option value="city-holds-breath-20x16-framed">The City Holds Its Breath · 20 × 16″ framed</option><option value="horizon-10x8-matte-framed">Golden Horizon · 10 × 8″ framed</option></select></label>
<label>Email<input name="email" type="email" autocomplete="email" required maxlength="254"></label>
<label>Delivery ZIP code<input name="zip" inputmode="numeric" autocomplete="postal-code" pattern="[0-9]{5}" maxlength="5" required></label>
<label hidden>Company<input name="company" tabindex="-1" autocomplete="off"></label>
<button type="submit" id="sendRequest" class="wide">Send print request</button>
</form><p id="result" role="status" aria-live="polite"></p></section></main></body></html>
