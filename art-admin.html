<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>HUGS Art | Private Review</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/art-app.css">
<style>
body{background:#eff5fb;color:#10233d}.review-wrap{max-width:1050px;margin:38px auto 130px;padding:0 18px}.review-head{padding:24px;border-radius:24px;background:#071f3b;color:white}.review-head h1{color:white;margin:0 0 8px}.review-head p{color:#d8e9fa}.auth-panel,.review-card{background:#fff;border:1px solid #dbe6f2;border-radius:20px;padding:22px;margin-top:18px;box-shadow:0 6px 25px #071f3b12}.auth-panel input,.review-card textarea{font:inherit;padding:12px;width:100%;border:1px solid #bdcfe1;border-radius:12px}.review-card{display:grid;grid-template-columns:minmax(0,230px) 1fr;gap:20px}.review-card img{display:block;width:100%;height:auto;max-height:280px;object-fit:contain;background:#f6f8fb;border-radius:12px}.review-card h2{margin:0 0 8px;font-size:1.35rem}.review-card p{margin:7px 0;line-height:1.5}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.controls button,.auth-panel button{padding:11px 14px;border:0;border-radius:13px;background:#0d5394;color:white;font:inherit;font-weight:800;cursor:pointer}.controls button[data-action="decline-artist"]{background:#972c38}.controls button[data-action="hold-artist"]{background:#765020}.controls button[data-action="clear-flags"]{background:#415984}.review-card .status{display:inline-block;padding:4px 10px;background:#e5effa;border-radius:99px;font-weight:800}.review-card textarea{min-height:68px}.muted{color:#52677b}.review-card .private-note{color:#9b3434;font-weight:750}@media(max-width:620px){.review-card{grid-template-columns:1fr}.review-card img{max-height:300px}}
</style></head><body>
<main class="review-wrap"><section class="review-head"><h1>HUGS Art · Private Review</h1><p>Moderation queue for authorized HUGS administrators. Artwork stays private until an administrator approves publication. Automated checks are preliminary only.</p></section>
<section class="auth-panel"><label for="adminToken"><strong>HUGS Admin access token</strong></label><input id="adminToken" type="password" autocomplete="off" placeholder="Enter private admin token"><div class="controls"><button id="load" type="button">Open review queue</button><button id="logout" type="button">Lock this screen</button></div><p id="status" role="status" aria-live="polite" class="muted">Credentials are held only in this open page, not saved on this device.</p></section>
<section id="results" aria-label="Moderation queue"></section></main>
<script>
(()=>{let token="",imageURLs=[];
const el=id=>document.getElementById(id),status=text=>el("status").textContent=text;
function clear(){imageURLs.forEach(URL.revokeObjectURL);imageURLs=[];el("results").replaceChildren()}
function api(action,data){return fetch("/.netlify/functions/admin-artists",{method:action?"POST":"GET",headers:{"Authorization":"Bearer "+token,...(action?{"Content-Type":"application/json"}:{})},...(action?{body:JSON.stringify(data)}:{})}).then(async r=>{const j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||"Request failed");return j})}
async function showImage(img,id){try{const r=await fetch("/.netlify/functions/admin-preview-art-image?id="+encodeURIComponent(id),{headers:{Authorization:"Bearer "+token},cache:"no-store"});if(!r.ok)throw Error();const url=URL.createObjectURL(await r.blob());imageURLs.push(url);img.src=url}catch{img.alt="Private preview unavailable"}}
function make(type,cls,text){const e=document.createElement(type);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
async function reload(){clear();status("Loading private submissions…");try{const result=await api(null);const list=result.artists||[];status(list.length+" submissions found. New and flagged work must be reviewed before publishing.");if(!list.length){el("results").append(make("p","muted","No submissions in this project's queue."));return}list.sort((a,b)=>((a.status==="Flagged Review"?0:1)-(b.status==="Flagged Review"?0:1))||(String(b.created_at||"").localeCompare(String(a.created_at||""))));
for(const a of list){const card=make("article","review-card");const img=make("img");img.alt="Private artwork preview";if(a.artwork_image_id)showImage(img,a.artwork_image_id);const content=make("div");content.append(make("h2",null,a.artwork_title||"Untitled artwork"),make("p","status",a.status||"Pending Review"),make("p",null,"Artist: "+(a.artist_name||"Unknown")),make("p","muted","Medium: "+(a.primary_medium||"Not supplied")),make("p","muted","Rights declaration: "+(a.rights_confirmed===true?"Confirmed by submitter":"Not recorded")),make("p",null,a.artist_statement||"No statement"));
if(a.moderation?.flags?.length)content.append(make("p","private-note","Automated flags: "+a.moderation.flags.join(", ")+". A human must review context."));
const note=make("textarea");note.placeholder="Internal moderation notes / justification";note.setAttribute("aria-label","Internal review note for "+(a.artwork_title||a.id));content.append(note);const controls=make("div","controls");
for(const [label,action] of [["Approve & publish","approve-publish"],["Hold","hold-artist"],["Decline","decline-artist"],["Clear flags (reviewed)","clear-flags"]]){if(action==="clear-flags"&&!a.moderation?.flags?.length)continue;const button=make("button",null,label);button.type="button";button.dataset.action=action;button.onclick=async()=>{if(action==="clear-flags"&&!note.value.trim()){status("Explain the flag review before clearing it.");note.focus();return}if(action==="approve-publish"&&(!a.rights_confirmed||a.moderation?.flags?.length)){status("Publishing blocked: missing rights declaration or unresolved safety flag.");return}button.disabled=true;try{const ans=await api(true,{artist_id:a.id,action,admin_note:note.value});await reload();status(ans.message||"Moderation decision saved.")}catch(e){status(e.message);button.disabled=false}};controls.append(button)}
content.append(controls);card.append(img,content);el("results").append(card)}}catch(e){status("Unable to load review queue: "+e.message)}}
el("load").onclick=()=>{token=el("adminToken").value.trim();el("adminToken").value="";if(!token){status("Enter your admin token.");return}reload()};
el("logout").onclick=()=>{token="";el("adminToken").value="";clear();status("Screen locked.")};
})();
</script></body></html>
