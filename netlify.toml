[build]
  publish = "."
  functions = "netlify/functions"
  command = "npm run build"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/"
  to = "/art-community.html"
  status = 200

[[redirects]]
  from = "/art-community"
  to = "/art-community.html"
  status = 200

[[redirects]]
  from = "/artist-submit"
  to = "/artist-submit.html"
  status = 200

[[redirects]]
  from = "/art-voting"
  to = "/art-voting.html"
  status = 200
\n
[[redirects]]
  from = "/hugs-admin.html"
  to = "/404.html"
  status = 404
  force = true
