[build]
  publish = "."
  functions = "netlify/functions"
  command = "npm run build"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/"
  to = "/art-community.html"
  status = 200

[[redirects]]
  from = "/art-community"
  to = "/art-community.html"
  status = 200

[[redirects]]
  from = "/artist-submit"
  to = "/artist-submit.html"
  status = 200

[[redirects]]
  from = "/art-voting"
  to = "/art-voting.html"
  status = 200

[[redirects]]
  from = "/hugs-admin.html"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/artist-profile"
  to = "/artist-profile.html"
  status = 200

[[redirects]]
  from = "/art-social"
  to = "/art-social.html"
  status = 200

[[redirects]]
  from = "/art-collections"
  to = "/art-collections.html"
  status = 200
